name: CI
on: [push, pull_request]
jobs:
  core-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: just core-ci
  wasm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: just wasm-build
      - run: git diff --exit-code -- crates/yomilo-wasm/types
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: |
            crates/yomilo-wasm/pkg
            crates/yomilo-wasm/types
  html-ci:
    needs: wasm-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v5
        with:
          name: wasm-package
          path: crates/yomilo-wasm
      - run: just install
      - run: just html-ci

[package]
name = "article-wasm-poc"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
markdown = { version = "1.0.0", features = ["serde"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
budouy = { version = "0.2.2", features = ["vendored-models"] }

<desc id="d">原稿を判定し、描画準備を経て、描画によってHTMLになる流れ。規約に反した要素は拒否されたセグメントとして取り分ける。画像やカードの取得結果は利用側が描画準備へ渡す。テーマは出力のHTMLに当てる。書きかけの原稿は、判定から原稿へ戻って続きを足せる。</desc>
